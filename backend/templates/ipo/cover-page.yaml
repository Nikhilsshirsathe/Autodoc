id: cover-page
section_name: "Cover Page"
display_order: 1
description: >
  The cover page of the Draft Red Herring Prospectus. Contains company name,
  issue details, exchange, registrar, and disclaimer text as required by SEBI.
knowledge_mapping:
  - category: company
    fields: [company_name, cin, registered_address, website]
  - category: issue
    fields: [issue_size, price_band, face_value, lot_size, issue_open_date, issue_close_date]
  - category: exchange
    fields: [exchange_name, exchange_segment]
  - category: registrar
    fields: [registrar_name, registrar_address, registrar_contact]
validation_rules:
  - field: company.company_name
    required: true
    description: "Legal name of the issuer"
  - field: issue.issue_size
    required: true
    description: "Total issue size in INR crores"
  - field: issue.price_band
    required: false
    description: "Price band (floor - cap)"
  - field: exchange.exchange_name
    required: true
    description: "NSE Emerge or BSE SME"
prompt_template_path: "prompts/cover-page.md"
output_format: markdown
dependencies: []
estimated_pages: 1
sebi_reference: "SEBI (ICDR) Regulations, 2018 – Schedule VIII, Part A"
