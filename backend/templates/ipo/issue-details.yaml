id: issue-details
section_name: Issue Details
display_order: 22
description: Complete details of the issue including structure, timelines, allocation,
  and payment schedule.
knowledge_mapping:
- category: issue
  fields:
  - issue_type
  - issue_size
  - fresh_issue
  - offer_for_sale
  - price_band
  - lot_size
  - issue_dates
  - allocation_structure
- category: exchange
  fields:
  - exchange_name
validation_rules:
- field: issue.issue_size
  required: true
  description: Total issue size
- field: issue.price_band
  required: false
  description: Price band
- field: issue.lot_size
  required: true
  description: Minimum lot size
prompt_template_path: prompts/issue-details.md
output_format: markdown
dependencies:
- capital-structure
estimated_pages: 5
sebi_reference: SEBI (ICDR) Regulations, 2018
